<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TriBit Glyph&copy; Terminal</title>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
}

#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:24px;
  box-shadow:0 0 40px #00ff88aa inset;
  padding:14px;
  display:flex;
  flex-direction:column;
}

#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 18px #00ff88;
  display:flex;
  flex-direction:column;
}

textarea{
  width:100%;
  height:110px;
  background:transparent;
  border:none;
  color:#00ff88;
  outline:none;
  resize:none;
}

canvas{
  flex:1;
  margin-top:6px;
}

#keyboard{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.row{
  display:grid;
  gap:6px;
  width:100%;
  max-width:760px;
}

.key{
  position:relative;
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:10px;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
}

.key:active{
  background:#00ff88;
  color:black;
}

.key .alt{
  position:absolute;
  top:2px;
  right:4px;
  font-size:10px;
  opacity:0.6;
}

.dock{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  gap:6px;
  width:100%;
  max-width:760px;
}

.shiftActive{
  background:#00ff88 !important;
  color:black !important;
}
</style>
</head>

<body>

<div id="device">

<div id="screen">
<textarea id="input">hello web3 world!</textarea>
<canvas id="canvas" width="760" height="380"></canvas>
</div>

<div id="keyboard"></div>

</div>

<script>

/* ================= MODE DETECTION ================= */
const isSandboxed = window.origin === "null";

/* ================= CONFIG ================= */
const GLYPH_PATH="./glyphs/";
const GLYPH_SIZE=28;
const WAVE_AMPLITUDE=3;
const WAVE_SPEED=0.03;

/* ================= SHIFT ================= */
let shift=false;

const shiftMap={
"1":"!","2":"@","3":"#","4":"$","5":"%","6":"^","7":"&","8":"*","9":"(","0":")",
"-":"_","=":"+",
"[":"{","]":"}",
";":":","'":"\"",
",":"<",".":">","/":"?",
"\\":"|","`":"~"
};

const displayShiftMap={...shiftMap};

/* ================= GLYPH MAP ================= */
const glyphMap={ /* unchanged */ 
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png",
"0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"4":"4_.png","5":"5_.png","6":"6_.png","7":"7_.png",
"8":"8_.png","9":"9_.png",
".":"p.png",",":"ap.png","-":"-.png","/":"fSlash.png",
"'":"app.png",";":"semi.png","=":"eq+.png",
"!":"!.png","@":"crypto.png","#":"pp.png","$":"crypto.png",
"%":"pp.png","^":"bTick.png","&":"&.png","*":"+.png",
"(":"oB+.png",")":"cB+.png","_":"under.png","+":"+.png",
"<":"less.png",">":"more.png","|":"or.png","\\":"bSlash.png",
"[":"oSqBr.png","]":"cSqBr.png","{":"oBr.png","}":"cBr.png",
":":"colon.png","\"":"qu.png","`":"bTick.png","~":"bTick.png",
"?":"p.png"
};

/* ================= STATE ================= */
let glyphCache={}, time=0, typing=true, revealIndex=0;

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const input=document.getElementById("input");
const kb=document.getElementById("keyboard");

/* ================= PRELOAD ================= */
function preload(cb){
  let loaded=0;
  const keys=Object.keys(glyphMap);
  keys.forEach(k=>{
    const img=new Image();
    img.src=GLYPH_PATH+glyphMap[k];
    img.onload = img.onerror = ()=>{
      glyphCache[k]=img;
      if(++loaded===keys.length) cb();
    };
  });
}

/* ================= COMMAND SYSTEM ================= */
function handleCommand(cmd){
  if(isSandboxed){
    input.value = "[SAFE MODE] Commands disabled in OpenSea";
    return;
  }

  if(cmd === "/connect"){
    input.value = "Connecting wallet...";
    if(window.ethereum){
      window.ethereum.request({ method: 'eth_requestAccounts' })
        .then(()=> input.value="Wallet Connected")
        .catch(()=> input.value="Connection Failed");
    } else {
      input.value="No Wallet Found";
    }
  }

  if(cmd === "/mint"){
    input.value="Mint command triggered (hook your contract)";
  }

  if(cmd === "/unlock"){
    input.value="Checking NFT ownership...";
  }
}

/* ================= INPUT ================= */
function writeKey(k){
  const out=(shift && shiftMap[k]) ? shiftMap[k] : k;
  input.value+=out;

  // COMMAND DETECT
  if(out === " " || out === "\n"){
    const words=input.value.trim().split(" ");
    const last=words[words.length-1];
    if(last.startsWith("/")){
      handleCommand(last);
    }
  }
}

/* ================= DRAW ================= */
function draw(text){
  let x=10,y=10;
  const maxW=canvas.width-20;

  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.shadowColor="#00ff88";
  ctx.shadowBlur=10;

  for(let i=0;i<text.length;i++){
    let ch=text[i];
    let img=glyphCache[ch] || glyphCache[ch.toLowerCase()];
    const wave=Math.sin(time+i*0.3)*WAVE_AMPLITUDE;

    if(ch===" "){ x+=GLYPH_SIZE; continue; }

    if(img && img.complete && img.naturalWidth){
      if(x+GLYPH_SIZE>maxW){ x=10; y+=GLYPH_SIZE+10; }
      ctx.drawImage(img,x,y+wave,GLYPH_SIZE,GLYPH_SIZE);
      x+=GLYPH_SIZE;
    } else {
      ctx.fillText(ch,x,y);
      x+=GLYPH_SIZE/2;
    }
  }

  if(Math.floor(Date.now()/500)%2){
    ctx.fillRect(x,y,3,GLYPH_SIZE);
  }
}

/* ================= LOOP ================= */
function loop(){
  if(typing) revealIndex+=0.5;
  draw(input.value.slice(0,Math.floor(revealIndex)));
  time+=WAVE_SPEED;
  requestAnimationFrame(loop);
}

/* ================= KEYBOARD ================= */
const rows=[
"`1234567890-=",
"qwertyuiop[]",
"asdfghjkl;'",
"zxcvbnm,./\\"
];

rows.forEach(r=>{
  const row=document.createElement("div");
  row.className="row";
  row.style.gridTemplateColumns=`repeat(${r.length},1fr)`;

  r.split("").forEach(k=>{
    const b=document.createElement("div");
    b.className="key";

    const main=document.createElement("div");
    main.innerText=k;

    if(displayShiftMap[k]){
      const alt=document.createElement("div");
      alt.className="alt";
      alt.innerText=displayShiftMap[k];
      b.appendChild(alt);
    }

    b.appendChild(main);
    b.dataset.base=k;
    b.onclick=()=>writeKey(k);

    row.appendChild(b);
  });

  kb.appendChild(row);
});

/* DOCK */
const dock=document.createElement("div");
dock.className="dock";

const shiftBtn=document.createElement("div");
shiftBtn.className="key";
shiftBtn.innerText="SHIFT";

shiftBtn.onclick=()=>{
  shift=!shift;
  shiftBtn.classList.toggle("shiftActive",shift);
};

const space=document.createElement("div");
space.className="key";
space.innerText="SPACE";
space.onclick=()=>writeKey(" ");

const back=document.createElement("div");
back.className="key";
back.innerText="⌫";
back.onclick=()=>input.value=input.value.slice(0,-1);

dock.appendChild(shiftBtn);
dock.appendChild(space);
dock.appendChild(back);
kb.appendChild(dock);

/* ================= PHYSICAL ================= */
document.addEventListener("keydown",(e)=>{
  if(e.key.length===1) writeKey(e.key);
  if(e.key==="Backspace") input.value=input.value.slice(0,-1);
});

/* ================= START ================= */
if(isSandboxed){
  input.value="[OpenSea Mode] Limited functionality";
}

preload(loop);

</script>
</body>
</html>
