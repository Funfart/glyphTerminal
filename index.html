<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal Device</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
}

/* DEVICE */
#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:25px;
  box-shadow:0 0 40px #00ff88aa inset;
  padding:15px;
  display:flex;
  flex-direction:column;
}

/* SCREEN */
#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 15px #00ff88;
}

textarea{
  width:100%;
  height:110px;
  background:transparent;
  border:none;
  color:#00ff88;
  outline:none;
  resize:none;
}

/* CANVAS */
canvas{
  width:100%;
  height:260px;
}

/* KEYBOARD */
#keyboard{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.row{
  display:flex;
  justify-content:center;
  gap:6px;
}

.key{
  min-width:45px;
  padding:10px;
  text-align:center;
  border-radius:8px;
  border:1px solid #00ff88;
  color:#00ff88;
  background:#111;
  cursor:pointer;
  user-select:none;
  transition:0.1s;
}

.key:active{
  transform:scale(0.9);
  background:#00ff88;
  color:black;
  box-shadow:0 0 10px #00ff88;
}

.key.wide{min-width:90px;}
.key.space{min-width:300px;}
</style>
</head>

<body>

<div id="device">

<div id="screen">
<textarea id="input">hello web3</textarea>
<canvas id="canvas" width="760" height="260"></canvas>
</div>

<div id="keyboard"></div>

</div>

<script>

/* ================= GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png","_":"under.png","{":"oBr.png","}":"cBr.png",
"(":"oB+.png",")":"cB+.png",".":"p.png",";":"semi.png",
"'":"app.png","=":"eq+.png","/":"fSlash.png","$":"crypto.png",
"\\":"bSlash.png",":":"colon.png","<":"less.png",">":"more.png",
"!":"!.png","&":"&.png","|":"or.png","\"":"qu.png","+":"+.png",
"-":"-.png","`":"bTick.png",",":"ap.png","%":"pp.png",
"0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"]":"cSqBr.png","[":"oSqBr.png","4":"4_.png","5":"5_.png",
"6":"6_.png","7":"7_.png","8":"8_.png","9":"9_.png"
};

/* ================= STATE ================= */
const input=document.getElementById("input");
let cursorPos=input.value.length;

/* ================= CURSOR INSERT ================= */
function insertChar(char){
  const val=input.value;
  input.value=val.slice(0,cursorPos)+char+val.slice(cursorPos);
  cursorPos++;
}

function backspace(){
  if(cursorPos===0) return;
  const val=input.value;
  input.value=val.slice(0,cursorPos-1)+val.slice(cursorPos);
  cursorPos--;
}

function moveCursor(dir){
  if(dir==="left") cursorPos=Math.max(0,cursorPos-1);
  if(dir==="right") cursorPos=Math.min(input.value.length,cursorPos+1);
}

/* ================= HOLD REPEAT ================= */
function addHold(btn,fn){
  let interval;
  btn.onmousedown=()=>{
    fn();
    interval=setInterval(fn,100);
  };
  btn.onmouseup=()=>clearInterval(interval);
  btn.onmouseleave=()=>clearInterval(interval);
}

/* ================= KEYBOARD LAYOUT ================= */
const layout=[
["1","2","3","4","5","6","7","8","9","0"],
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"],
["-","=","[","]",";","'","\\",",",".","/"],
["space","⌫","←","→"]
];

const kb=document.getElementById("keyboard");

layout.forEach(row=>{
  const r=document.createElement("div");
  r.className="row";

  row.forEach(k=>{
    const btn=document.createElement("div");
    btn.className="key";
    btn.innerText=k;

    if(k==="space"){ btn.classList.add("space"); }
    if(k==="⌫"){ btn.classList.add("wide"); }

    if(k==="space") addHold(btn,()=>insertChar(" "));
    else if(k==="⌫") addHold(btn,backspace);
    else if(k==="←") addHold(btn,()=>moveCursor("left"));
    else if(k==="→") addHold(btn,()=>moveCursor("right"));
    else addHold(btn,()=>insertChar(k));

    r.appendChild(btn);
  });

  kb.appendChild(r);
});

/* ================= CANVAS RENDER ================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let glyphCache={}, time=0;

/* PRELOAD */
Object.keys(glyphMap).forEach(k=>{
  const img=new Image();
  img.src="./glyphs/"+glyphMap[k];
  glyphCache[k]=img;
});

function render(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let x=10, y=10;

  for(let i=0;i<input.value.length;i++){
    const ch=input.value[i];
    const img=glyphCache[ch];
    const wave=Math.sin(time+i*0.3)*3;

    if(img){
      ctx.drawImage(img,x,y+wave,28,28);
      x+=30;
    }
  }

  time+=0.05;
  requestAnimationFrame(render);
}

render();

</script>
</body>
</html>
