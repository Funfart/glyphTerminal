<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
}

#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:25px;
  box-shadow:0 0 40px #00ff88aa inset;
  padding:12px;
  display:flex;
  flex-direction:column;
}

/* SCREEN */
#screen{
  background:black;
  border-radius:12px;
  padding:8px;
  box-shadow:inset 0 0 15px #00ff88;
}

textarea{
  width:100%;
  height:90px;
  background:transparent;
  border:none;
  color:#00ff88;
  resize:none;
  outline:none;
}

canvas{
  width:100%;
  height:300px;
  margin-top:5px;
}

/* CONTROLS */
#controls{
  display:flex;
  gap:5px;
  margin-top:6px;
}
.ctrlBtn{
  flex:1;
  padding:6px;
  border:1px solid #00ff88;
  background:#111;
  color:#00ff88;
  border-radius:6px;
  cursor:pointer;
}

/* KEYBOARD */
#keyboard{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.row{
  display:flex;
  justify-content:center;
  gap:6px;
}

.key{
  min-width:38px;
  padding:10px;
  text-align:center;
  border-radius:8px;
  border:1px solid #00ff88;
  background:#111;
  color:#00ff88;
  cursor:pointer;
  user-select:none;
  transition:0.1s;
}

.key:active{
  transform:scale(0.9);
  background:#00ff88;
  color:black;
  box-shadow:0 0 10px #00ff88;
}

.wide{min-width:80px;}
.xwide{min-width:160px;}

</style>
</head>

<body>

<div id="device">

  <div id="screen">
    <textarea id="input">hello web3</textarea>
    <canvas id="canvas" width="760" height="300"></canvas>
  </div>

  <div id="controls">
    <button class="ctrlBtn" id="toggle">Encode</button>
    <button class="ctrlBtn" id="typeToggle">Play</button>
    <button class="ctrlBtn" id="export">GIF</button>
  </div>

  <div id="keyboard"></div>

</div>

<script>

/* ================= FULL GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png","_":"under.png","{":"oBr.png","}":"cBr.png",
"(":"oB+.png",")":"cB+.png",".":"p.png",";":"semi.png",
"'":"app.png","=":"eq+.png","/":"fSlash.png","$":"crypto.png",
"\\":"bSlash.png",":":"colon.png","<":"less.png",">":"more.png",
"!":"!.png","&":"&.png","|":"or.png","\"":"qu.png","+":"+.png",
"-":"-.png","`":"bTick.png",",":"ap.png","%":"pp.png",
"0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"]":"cSqBr.png","[":"oSqBr.png","4":"4_.png","5":"5_.png",
"6":"6_.png","7":"7_.png","8":"8_.png","9":"9_.png"
};

const GLYPH_PATH="./glyphs/";
const glyphCache={};

/* ================= PRELOAD ================= */
function preload(cb){
  let total=Object.keys(glyphMap).length, loaded=0;
  for(let k in glyphMap){
    const img=new Image();
    img.src=GLYPH_PATH+glyphMap[k];
    img.onload=()=>{glyphCache[k]=img; if(++loaded===total) cb();}
    img.onerror=()=>{glyphCache[k]=null; if(++loaded===total) cb();}
  }
}

/* ================= DRAW ================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let time=0, revealIndex=0, typing=true;

function draw(text){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let x=10,y=10;

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const img=glyphCache[ch];

    const wave=Math.sin(time+i*0.3)*3;

    if(ch===" "){x+=28; continue;}

    if(img){
      ctx.drawImage(img,x,y+wave,28,28);
      x+=28;
    }
  }
}

function loop(){
  if(typing) revealIndex+=0.5;
  const txt=input.value.slice(0,revealIndex);
  draw(txt);
  time+=0.03;
  requestAnimationFrame(loop);
}

/* ================= HOLD INPUT ================= */
let holdInterval=null;

function startHold(char){
  input.value+=char;
  holdInterval=setInterval(()=>input.value+=char,100);
}
function stopHold(){
  clearInterval(holdInterval);
}

/* ================= KEYBOARD LAYOUT ================= */
const layout=[
["1","2","3","4","5","6","7","8","9","0"],
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"],
[".",";",":","!","?","/","\\","-","_","+","="],
["[","]","{","}","(",")","<",">","$","%","&","|"],
["'","\"","`",","]
];

const kb=document.getElementById("keyboard");

layout.forEach(row=>{
  const rowDiv=document.createElement("div");
  rowDiv.className="row";

  row.forEach(k=>{
    const btn=document.createElement("div");
    btn.className="key";
    btn.innerText=k;

    btn.onmousedown=()=>startHold(k);
    btn.onmouseup=stopHold;
    btn.onmouseleave=stopHold;

    rowDiv.appendChild(btn);
  });

  kb.appendChild(rowDiv);
});

/* SPECIAL ROW */
const special=document.createElement("div");
special.className="row";

function specialKey(label,action,cls){
  const btn=document.createElement("div");
  btn.className="key "+cls;
  btn.innerText=label;

  btn.onmousedown=action;
  btn.onmouseup=stopHold;
  btn.onmouseleave=stopHold;

  return btn;
}

special.appendChild(specialKey("SPACE",()=>startHold(" "), "xwide"));
special.appendChild(specialKey("⌫",()=>input.value=input.value.slice(0,-1),"wide"));

kb.appendChild(special);

/* ================= CONTROLS ================= */
document.getElementById("typeToggle").onclick=()=>typing=!typing;
document.getElementById("toggle").onclick=()=>{input.value=input.value.split("").reverse().join(""); revealIndex=0;};

/* ================= START ================= */
const input=document.getElementById("input");
preload(()=>loop());

</script>
</body>
</html>
