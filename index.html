<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal UI v3</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family: monospace;
}

#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:22px;
  padding:12px;
  box-shadow:0 0 40px #00ff88aa inset;
  display:flex;
  flex-direction:column;
}

#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 15px #00ff88;
  display:flex;
  flex-direction:column;
  position:relative;
}

canvas{
  flex:1;
  border-radius:8px;
}

/* ===== CURSOR OVERLAY ===== */
#cursor{
  position:absolute;
  top:130px;
  left:20px;
  width:10px;
  height:22px;
  background:#00ff88;
  animation:blink 0.5s infinite;
  box-shadow:0 0 10px #00ff88;
}

@keyframes blink{
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}

/* ===== CONTROLS ===== */
#controls{
  display:flex;
  gap:6px;
  margin-top:8px;
}

button{
  flex:1;
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:6px;
  border-radius:6px;
}

/* ===== KEYBOARD GRID ===== */
#keyboard{
  margin-top:10px;
  display:grid;
  grid-template-columns: repeat(10, 1fr);
  gap:6px;
}

/* keys */
.key{
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:10px;
  text-align:center;
  border-radius:8px;
  user-select:none;
  transition:0.08s;
}

.key:active{
  transform:scale(0.88);
  background:#00ff88;
  color:black;
  box-shadow:0 0 10px #00ff88;
}

/* space */
.space{
  grid-column: span 5;
}

/* arrows cluster */
.arrow{
  background:#0c0c0c;
}
</style>
</head>

<body>

<div id="device">

  <div id="screen">
    <canvas id="canvas" width="760" height="420"></canvas>
    <div id="cursor"></div>
  </div>

  <div id="controls">
    <button id="clear">Clear</button>
    <button id="mode">Mode</button>
    <button id="export">GIF</button>
  </div>

  <div id="keyboard"></div>

</div>

<script>

/* ================= GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png","0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"4":"4_.png","5":"5_.png","6":"6_.png","7":"7_.png","8":"8_.png","9":"9_.png",
".":"p.png",",":"ap.png","/":"fSlash.png","-":"-.png","+":"+.png",
"=":"eq+.png","!":"!.png","?":"q.png","(": "oB+.png",")":"cB+.png"
};

/* ================= STATE ================= */
let glyphCache={};
let buffer=[];
let cursor=0;
let time=0;

/* ================= CANVAS ================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const GLYPH_SIZE=26;
const MARGIN=20;

/* ================= LOAD ================= */
function load(cb){
  let count=0;
  const keys=Object.keys(glyphMap);
  keys.forEach(k=>{
    const img=new Image();
    img.src="./glyphs/"+glyphMap[k];
    img.onload=()=>{glyphCache[k]=img; if(++count===keys.length) cb();}
  });
}

/* ================= RENDER ================= */
function render(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let x=MARGIN,y=MARGIN;

  for(let i=0;i<buffer.length;i++){
    const ch=buffer[i];
    const img=glyphCache[ch];

    if(ch===" "){ x+=GLYPH_SIZE; continue; }

    if(img){
      ctx.drawImage(img,x,y,GLYPH_SIZE,GLYPH_SIZE);
      x+=GLYPH_SIZE;
    }

    /* wrap */
    if(x>700){ x=MARGIN; y+=GLYPH_SIZE+10; }
  }

  /* cursor blink anchor */
  time++;
  requestAnimationFrame(render);
}

/* ================= INPUT ENGINE ================= */
function insert(ch){
  buffer.splice(cursor,0,ch);
  cursor++;
}

/* ================= HOLD KEY SYSTEM ================= */
let holdInterval=null;

function startHold(ch){
  insert(ch);
  holdInterval=setInterval(()=>insert(ch),80);
}

function stopHold(){
  clearInterval(holdInterval);
}

/* ================= KEYBOARD ================= */
const layout=[
"1 2 3 4 5 6 7 8 9 0",
"q w e r t y u i o p",
"a s d f g h j k l",
"z x c v b n m",
". , / - + =",
"SPACE BACK ← →"
];

const kb=document.getElementById("keyboard");

layout.forEach(row=>{
  row.split(" ").forEach(k=>{
    const btn=document.createElement("div");
    btn.className="key";

    if(k==="SPACE") btn.classList.add("space");
    if(["←","→"].includes(k)) btn.classList.add("arrow");

    btn.innerText=k;

    btn.onmousedown=()=>handleDown(k);
    btn.onmouseup=stopHold;
    btn.onmouseleave=stopHold;

    kb.appendChild(btn);
  });
});

/* ================= KEY LOGIC ================= */
function handleDown(k){

  if(k==="SPACE") return insert(" ");
  if(k==="BACK") return buffer.splice(--cursor,1);

  if(k==="←") return cursor=Math.max(0,cursor-1);
  if(k==="→") return cursor=Math.min(buffer.length,cursor+1);

  startHold(k);
}

/* ================= PHYSICAL KEYBOARD ================= */
document.addEventListener("keydown",(e)=>{
  const k=e.key.toLowerCase();

  if(k.length===1){
    insert(k);
  }

  if(e.key==="Backspace"){
    buffer.splice(Math.max(cursor-1,0),1);
    cursor=Math.max(cursor-1,0);
  }

  if(e.key==="ArrowLeft") cursor=Math.max(0,cursor-1);
  if(e.key==="ArrowRight") cursor=Math.min(buffer.length,cursor+1);
});

/* ================= UI BUTTONS ================= */
document.getElementById("clear").onclick=()=>{
  buffer=[];
  cursor=0;
};

document.getElementById("mode").onclick=()=>{
  buffer.reverse();
};

/* ================= START ================= */
load(()=>render());

</script>
</body>
</html>
