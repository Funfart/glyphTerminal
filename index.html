<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal UI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
}

/* ===== DEVICE ===== */
#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:24px;
  box-shadow:0 0 40px #00ff88aa inset;
  padding:14px;
  display:flex;
  flex-direction:column;
}

/* ===== SCREEN ===== */
#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 18px #00ff88;
  display:flex;
  flex-direction:column;
  position:relative;
}

textarea{
  width:100%;
  height:110px;
  background:transparent;
  border:none;
  color:#00ff88;
  outline:none;
  resize:none;
  font-size:14px;
}

canvas{
  flex:1;
  margin-top:6px;
  border-radius:8px;
}

/* ===== CONTROLS ===== */
#controls{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.ctrlBtn{
  flex:1;
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  border-radius:6px;
  padding:6px;
}

/* ===== KEYBOARD ===== */
#keyboard{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  align-items:center;   /* CENTER ENTIRE KEYBOARD */
  gap:6px;
  max-height:240px;
  overflow:hidden;
}

/* KEY ROWS */
.row{
  display:grid;
  grid-template-columns: repeat(10, 1fr);
  gap:6px;
  width:100%;
  max-width:760px;   /* keeps centered + contained */
}

.key{
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:10px;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
  user-select:none;
  transition:0.1s;
}

.key:active{
  transform:scale(0.92);
  background:#00ff88;
  color:black;
}

/* SPECIAL KEYS */
.space{
  grid-column: span 6;
}

.backspace{
  grid-column: span 2;
}
</style>
</head>

<body>

<div id="device">

  <div id="screen">
    <textarea id="input">hello web3 world</textarea>
    <canvas id="canvas" width="760" height="380"></canvas>
  </div>

  <div id="controls">
    <button class="ctrlBtn" id="toggle">Encode</button>
    <button class="ctrlBtn" id="typeToggle">Play</button>
    <button class="ctrlBtn" id="export">GIF</button>
  </div>

  <div id="keyboard"></div>

</div>

<script>

/* ================= CONFIG ================= */
const GLYPH_PATH="./glyphs/";
const GLYPH_SIZE=28;
const WAVE_AMPLITUDE=3;
const WAVE_SPEED=0.03;

/* ================= GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png",
"0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"4":"4_.png","5":"5_.png","6":"6_.png","7":"7_.png",
"8":"8_.png","9":"9_.png",
".":"p.png",",":"ap.png","-":"-.png","/":"fSlash.png",
"'":"app.png",";":"semi.png","=":"eq+.png"
};

/* ================= STATE ================= */
let glyphCache={}, time=0, typing=true, revealIndex=0;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const input=document.getElementById("input");

/* ================= PRELOAD ================= */
function preload(cb){
  let loaded=0;
  const keys=Object.keys(glyphMap);

  keys.forEach(k=>{
    const img=new Image();
    img.src=GLYPH_PATH+glyphMap[k];
    img.onload=()=>{
      glyphCache[k]=img;
      if(++loaded===keys.length) cb();
    };
  });
}

/* ================= DRAW (FIXED WRAPPING) ================= */
function draw(text){
  let x=10,y=10;
  const maxW=canvas.width-20;

  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.shadowColor="#00ff88";
  ctx.shadowBlur=10;

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const img=glyphCache[ch];
    const wave=Math.sin(time+i*0.3)*WAVE_AMPLITUDE;

    if(ch===" "){
      x+=GLYPH_SIZE;
    } else if(img){
      if(x+GLYPH_SIZE>maxW){
        x=10;
        y+=GLYPH_SIZE+10;
      }

      ctx.drawImage(img,x,y+wave,GLYPH_SIZE,GLYPH_SIZE);
      x+=GLYPH_SIZE;
    }
  }

  /* ===== CURSOR ===== */
  let cx=10, cy=10;
  const before=input.value.slice(0,Math.floor(revealIndex));

  for(let i=0;i<before.length;i++){
    const ch=before[i];
    if(ch===" "){
      cx+=GLYPH_SIZE;
    } else if(glyphCache[ch]){
      if(cx+GLYPH_SIZE>maxW){
        cx=10;
        cy+=GLYPH_SIZE+10;
      }
      cx+=GLYPH_SIZE;
    }
  }

  if(Math.floor(Date.now()/500)%2){
    ctx.fillStyle="#00ff88";
    ctx.fillRect(cx,cy,3,GLYPH_SIZE);
  }
}

/* ================= LOOP ================= */
function loop(){
  if(typing) revealIndex+=0.5;
  draw(input.value.slice(0,revealIndex));
  time+=WAVE_SPEED;
  requestAnimationFrame(loop);
}

/* ================= HOLD INPUT ================= */
let holdTimer=null;
let holding=false;

function startHold(k){
  if(holding) return;
  holding=true;

  input.value+=k;

  holdTimer=setInterval(()=>{
    input.value+=k;
  },140);
}

function stopHold(){
  holding=false;
  clearInterval(holdTimer);
}

/* ================= KEYBOARD ================= */
const layout=[
"1234567890",
"qwertyuiop",
"asdfghjkl",
"zxcvbnm",
".,-/'="
];

const kb=document.getElementById("keyboard");

layout.forEach(row=>{
  const r=document.createElement("div");
  r.className="row";

  row.split("").forEach(k=>{
    const btn=document.createElement("div");
    btn.className="key";
    btn.innerText=k;

    btn.onmousedown=()=>startHold(k);
    btn.onmouseup=stopHold;
    btn.onmouseleave=stopHold;

    r.appendChild(btn);
  });

  kb.appendChild(r);
});

/* ===== SPACE + BACKSPACE (FIXED) ===== */
const bottomRow=document.createElement("div");
bottomRow.className="row";

/* SPACE */
const space=document.createElement("div");
space.className="key space";
space.innerText="SPACE";
space.onclick=()=>input.value+=" ";

/* BACKSPACE */
const back=document.createElement("div");
back.className="key backspace";
back.innerText="⌫";
back.onclick=()=>input.value=input.value.slice(0,-1);

bottomRow.appendChild(space);
bottomRow.appendChild(back);
kb.appendChild(bottomRow);

/* ================= PHYSICAL KEYBOARD ================= */
document.addEventListener("keydown",(e)=>{
  if(e.key.length===1) input.value+=e.key;
});

/* ================= START ================= */
preload(loop);

</script>
</body>
</html>
