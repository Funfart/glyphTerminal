<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal</title>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
}

#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:24px;
  box-shadow:0 0 40px #00ff88aa inset;
  padding:14px;
  display:flex;
  flex-direction:column;
}

#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 18px #00ff88;
  display:flex;
  flex-direction:column;
}

textarea{
  width:100%;
  height:110px;
  background:transparent;
  border:none;
  color:#00ff88;
  outline:none;
  resize:none;
}

canvas{
  flex:1;
  margin-top:6px;
}

#keyboard{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.row{
  display:grid;
  grid-template-columns: repeat(10,1fr);
  gap:6px;
  width:100%;
  max-width:760px;
}

.key{
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:10px;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
}

.key:active{
  background:#00ff88;
  color:black;
}

.dock{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  gap:6px;
  width:100%;
  max-width:760px;
}

.shiftActive{
  background:#00ff88 !important;
  color:black !important;
}

  /* ADD THIS */
.key{
  position:relative;
}

/* small top-right symbol */
.key .alt{
  position:absolute;
  top:2px;
  right:4px;
  font-size:10px;
  opacity:0.6;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="device">

<div id="screen">
<textarea id="input">hello web3 world!</textarea>
<canvas id="canvas" width="760" height="380"></canvas>
</div>

<div id="keyboard"></div>

</div>

<script>

/* ================= CONFIG ================= */
const GLYPH_PATH="./glyphs/";
const GLYPH_SIZE=28;
const WAVE_AMPLITUDE=3;
const WAVE_SPEED=0.03;

/* ================= SHIFT ================= */
let shift=false;

const shiftMap = {
"1":"!","2":"@","3":"#","4":"$","5":"%","6":"^","7":"&","8":"*","9":"(","0":")",
"-":"_","=":"+",
"[":"{","]":"}",
";":":","'":"\"",
",":"<",".":">","/":"?",
"\\":"|","`":"~"
};
const displayShiftMap={
"1":"!","2":"@","3":"#","4":"$","5":"%","6":"^","7":"&","8":"*","9":"(","0":")",
"-":"_","=":"+",
".":">",",":"<"
};
/* ================= GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",

" ":"space.png",

"0":"0.png","1":"1_.png","2":"2_.png","3":"3_.png",
"4":"4_.png","5":"5_.png","6":"6_.png","7":"7_.png",
"8":"8_.png","9":"9_.png",

".":"p.png",",":"ap.png","-":"-.png","/":"fSlash.png",
"'":"app.png",";":"semi.png","=":"eq+.png",

/* SHIFT SYMBOLS */
"!":"!.png","&":"&.png","|":"or.png","\"":"qu.png","+":"+.png",
"<":"less.png",">":"more.png","_":"under.png","%":"pp.png",
"$":"crypto.png","(":"oB+.png",")":"cB+.png","[":"oSqBr.png",
"]":"cSqBr.png","{":"oBr.png","}":"cBr.png",":":"colon.png",
"\"":"qu.png","?":"q.png", "|":"or.png","~":"bTick.png"
};

/* ================= STATE ================= */
let glyphCache={}, time=0, typing=true, revealIndex=0;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const input=document.getElementById("input");

/* ================= PRELOAD ================= */
function preload(cb){
  let loaded=0;
  const keys=Object.keys(glyphMap);

  keys.forEach(k=>{
    const img=new Image();
    img.src=GLYPH_PATH+glyphMap[k];
    img.onload=()=>{
      glyphCache[k]=img;
      if(++loaded===keys.length) cb();
    };
  });
}

/* ================= INPUT ================= */
function writeKey(k){
  const out=(shift && shiftMap[k]) ? shiftMap[k] : k;
  input.value+=out;
}

/* ================= DRAW ================= */
function draw(text){
  let x=10,y=10;
  const maxW=canvas.width-20;

  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.shadowColor="#00ff88";
  ctx.shadowBlur=10;

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const img=glyphCache[ch];
    const wave=Math.sin(time+i*0.3)*WAVE_AMPLITUDE;

    if(ch===" "){
      x+=GLYPH_SIZE;
      continue;
    }

    if(img){
      if(x+GLYPH_SIZE>maxW){
        x=10;
        y+=GLYPH_SIZE+10;
      }

      ctx.drawImage(img,x,y+wave,GLYPH_SIZE,GLYPH_SIZE);
      x+=GLYPH_SIZE;
    }
  }

  /* CURSOR */
  let cx=10, cy=10;
  const before=text;

  for(let i=0;i<before.length;i++){
    const ch=before[i];

    if(ch===" "){
      cx+=GLYPH_SIZE;
    } else if(glyphCache[ch]){
      if(cx+GLYPH_SIZE>maxW){
        cx=10;
        cy+=GLYPH_SIZE+10;
      }
      cx+=GLYPH_SIZE;
    }
  }

  if(Math.floor(Date.now()/500)%2){
    ctx.fillRect(cx,cy,3,GLYPH_SIZE);
  }
}

/* ================= LOOP ================= */
function loop(){
  if(typing) revealIndex+=0.5;
  const text=input.value.slice(0,Math.floor(revealIndex));
  draw(text);
  time+=WAVE_SPEED;
  requestAnimationFrame(loop);
}

rows.forEach(r=>{
  const row=document.createElement("div");
  row.className="row";

  r.split("").forEach(k=>{
    const b=document.createElement("div");
    b.className="key";

    const main=document.createElement("div");
    main.className="main";
    main.innerText=k;

    // ALT SYMBOL (top-right)
    if(displayShiftMap[k]){
      const alt=document.createElement("div");
      alt.className="alt";
      alt.innerText=displayShiftMap[k];
      b.appendChild(alt);
    }

    b.appendChild(main);

    b.onclick=()=>writeKey(k);

    b.dataset.base=k;

    row.appendChild(b);
  });

  kb.appendChild(row);
});
/* DOCK */
const dock=document.createElement("div");
dock.className="dock";

const shiftBtn=document.createElement("div");
shiftBtn.className="key";
shiftBtn.innerText="SHIFT";
shiftBtn.onclick=()=>{
  shift=!shift;
  shiftBtn.classList.toggle("shiftActive",shift);

  // UPDATE KEY LABELS
  document.querySelectorAll(".key").forEach(btn=>{
    if(!btn.dataset.base) return;

    const base=btn.dataset.base;
    const main=btn.querySelector(".main");

    if(shift && displayShiftMap[base]){
      main.innerText=displayShiftMap[base];
    } else {
      main.innerText=base;
    }
  });
};

const space=document.createElement("div");
space.className="key";
space.innerText="SPACE";
space.onclick=()=>input.value+=" ";

const back=document.createElement("div");
back.className="key";
back.innerText="⌫";
back.onclick=()=>input.value=input.value.slice(0,-1);

dock.appendChild(shiftBtn);
dock.appendChild(space);
dock.appendChild(back);
kb.appendChild(dock);

/* PHYSICAL KEYBOARD */
document.addEventListener("keydown",(e)=>{
  if(e.key.length===1) writeKey(e.key);
  if(e.key==="Backspace") input.value=input.value.slice(0,-1);
});

/* START */
preload(loop);

</script>
</body>
</html>
