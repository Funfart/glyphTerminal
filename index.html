<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Terminal UI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family: 'Courier New', monospace;
}

/* ===== MAIN DEVICE ===== */
#device{
  width:800px;
  height:800px;
  background:linear-gradient(145deg,#0f0f18,#050508);
  border-radius:25px;
  box-shadow:0 0 40px #00ff88aa inset, 0 0 25px #000;
  padding:15px;
  display:flex;
  flex-direction:column;
}

/* ===== SCREEN ===== */
#screen{
  flex:1;
  background:black;
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 15px #00ff88;
  display:flex;
  flex-direction:column;
}

textarea{
  width:100%;
  height:120px;
  background:transparent;
  border:none;
  color:#00ff88;
  resize:none;
  outline:none;
  font-size:14px;
}

/* ===== CANVAS ===== */
canvas{
  flex:1;
  margin-top:5px;
  border-radius:8px;
}

/* ===== CONTROLS ===== */
#controls{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.ctrlBtn{
  flex:1;
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  border-radius:6px;
  padding:6px;
  cursor:pointer;
  transition:0.2s;
}
.ctrlBtn:hover{
  background:#00ff88;
  color:black;
}

/* ===== KEYBOARD ===== */
#keyboard{
  margin-top:10px;
  display:grid;
  grid-template-columns: repeat(10,1fr);
  gap:6px;
}

.key{
  background:#111;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:10px;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
  user-select:none;
  transition:all 0.1s ease;
}

/* PRESS ANIMATION */
.key:active{
  transform:scale(0.9);
  background:#00ff88;
  color:black;
  box-shadow:0 0 10px #00ff88;
}

/* SPACEBAR */
.key.space{
  grid-column: span 5;
}

</style>
</head>

<body>

<div id="device">

  <div id="screen">
    <textarea id="input">hello web3 world</textarea>
    <canvas id="canvas" width="760" height="380"></canvas>
  </div>

  <div id="controls">
    <button class="ctrlBtn" id="toggle">Encode</button>
    <button class="ctrlBtn" id="typeToggle">Play</button>
    <button class="ctrlBtn" id="export">GIF</button>
  </div>

  <div id="keyboard"></div>

</div>

<script>

/* ================= CONFIG ================= */
const GLYPH_PATH="./glyphs/";
const GLYPH_SIZE=28;
const LINE_HEIGHT=40;
const MARGIN=10;
const WAVE_AMPLITUDE=3;
const WAVE_SPEED=0.03;

/* ================= GLYPH MAP ================= */
const glyphMap={
a:"1.png",b:"2.png",c:"3.png",d:"4.png",e:"5.png",
f:"6.png",g:"7.png",h:"8.png",i:"9.png",j:"10.png",
k:"11.png",l:"12.png",m:"13.png",n:"14.png",o:"15.png",
p:"16.png",q:"17.png",r:"18.png",s:"19.png",t:"20.png",
u:"21.png",v:"22.png",w:"23.png",x:"24.png",y:"25.png",z:"26.png",
" ":"space.png"
};

/* ================= STATE ================= */
let glyphCache={}, time=0, typing=true, revealIndex=0;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const input=document.getElementById("input");

/* ================= PRELOAD ================= */
function preloadGlyphs(cb){
  let loaded=0;
  Object.keys(glyphMap).forEach(k=>{
    const img=new Image();
    img.src=GLYPH_PATH+glyphMap[k];
    img.onload=()=>{glyphCache[k]=img; if(++loaded===Object.keys(glyphMap).length) cb();}
  });
}

/* ================= DRAW ================= */
function drawFrame(text){
  let x=MARGIN, y=MARGIN;

  ctx.fillStyle="#00ff88";
  ctx.shadowBlur=10;
  ctx.shadowColor="#00ff88";

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const img=glyphCache[ch];

    const wave=Math.sin(time+i*0.3)*WAVE_AMPLITUDE;

    if(ch===" "){ x+=GLYPH_SIZE; continue; }

    if(img){
      ctx.drawImage(img,x,y+wave,GLYPH_SIZE,GLYPH_SIZE);
      x+=GLYPH_SIZE;
    }
  }
}

/* ================= LOOP ================= */
function render(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(typing) revealIndex+=0.5;
  const txt=input.value.slice(0,revealIndex);

  drawFrame(txt);
  time+=WAVE_SPEED;

  requestAnimationFrame(render);
}

/* ================= KEYBOARD ================= */
const keys=[
"q","w","e","r","t","y","u","i","o","p",
"a","s","d","f","g","h","j","k","l",
"z","x","c","v","b","n","m"
];

const kb=document.getElementById("keyboard");

keys.forEach(k=>{
  const btn=document.createElement("div");
  btn.className="key";
  btn.innerText=k;
  btn.onclick=()=>{input.value+=k};
  kb.appendChild(btn);
});

/* SPACE */
const space=document.createElement("div");
space.className="key space";
space.innerText="SPACE";
space.onclick=()=>input.value+=" ";
kb.appendChild(space);

/* BACKSPACE */
const back=document.createElement("div");
back.className="key";
back.innerText="⌫";
back.onclick=()=>input.value=input.value.slice(0,-1);
kb.appendChild(back);

/* ================= BUTTONS ================= */
document.getElementById("typeToggle").onclick=()=>typing=!typing;

document.getElementById("toggle").onclick=()=>{
  input.value=input.value.split("").reverse().join(""); // placeholder effect
  revealIndex=0;
};

/* ================= START ================= */
preloadGlyphs(()=>render());

</script>
</body>
</html>
